name: Weather App CI/CD
env:
  IMAGE_TAG    = "${GITHUB_RUN_NUMBER}"
on:
  push:
    branches:
      - main
      - feature-1

jobs:

  build:

    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/weather-app:${IMAGE_TAG}  .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/weather-app:${IMAGE_TAG}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/
