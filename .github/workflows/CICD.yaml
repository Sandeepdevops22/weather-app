name: Weather App CI/CD
 
on:
  push:
    branches:
      - main
      - feature-1
 
jobs:

  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.run_number }}

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/weather-app:$IMAGE_TAG .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/weather-app:$IMAGE_TAG

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1
       
    - name: Deploy to Kubernetes
      run: |
        aws eks update-kubeconfig --region ap-southeast-1 --name weather-eks
        sudo kubectl apply -f K8s/
        sudo kubectl set image deployment/weather-app weather-container=${{ secrets.DOCKER_USERNAME }}/weather-app:$IMAGE_TAG
