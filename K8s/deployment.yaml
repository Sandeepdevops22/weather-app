apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather
  template:
    metadata:
      labels:
        app: weather
    spec:
      containers:
      - name: weather-container
        image: vinayak432/weather-app:${IMAGE_TAG}
        ports:
        - containerPort: 5000
        volumeMounts:
        - mountPath: "/data"
          name: weather-storage
      volumes:
      - name: weather-storage
        persistentVolumeClaim:
          claimName: weather-pvc
